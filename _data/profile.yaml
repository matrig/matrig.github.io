page_title: "Mattia Rigotti · Senior Research Scientist, IBM Research · AI reasoning & neuroscience"

job_title: "Senior Research Scientist"

description: "Senior Research Scientist at IBM Research. Research on reasoning and alignment in LLMs, neural operators for fluid dynamics, visual foundation models, trustworthy AI, and neural representations. Publications in Nature, NeurIPS, ICML, ICLR."

bio: "Mattia Rigotti is a Senior Research Scientist at IBM Research in Zurich, working at the intersection of machine learning and neuroscience. Research areas: reasoning and alignment in large language models, neural operators for computational fluid dynamics, visual foundation models, trustworthy AI, and the geometry of neural representations in deep learning architectures and the brain. Previously Research Staff Member at the IBM T.J. Watson Research Center (2014–2020) and postdoctoral researcher in theoretical neuroscience at New York University and Columbia University. Ph.D. in Theoretical Neuroscience from Columbia University (2010), M.Sc. in Theoretical Physics from ETH Zurich."

